<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Регистрация — SplitBill</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <h1>SplitBill</h1>
    <p class="subtitle">Создайте аккаунт</p>

    <div class="card">
      <form id="register-form">
        <div class="form-row">
          <input type="text" id="name" placeholder="Имя" required />
        </div>
        <div class="form-row">
          <input type="email" id="email" placeholder="Email" required />
        </div>
        <div class="form-row">
          <input type="password" id="password" placeholder="Пароль" required minlength="6" />
        </div>
        <button type="submit">Зарегистрироваться</button>
      </form>
      <p class="error" id="error"></p>
      <p class="link-row">Уже есть аккаунт? <a href="login.html">Войти</a></p>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
