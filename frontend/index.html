<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SplitBill — Расходы группы</title>
<style>
  :root {
    --bg: #f7f7f8;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #6b7280;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --border: #e5e7eb;
    --error: #dc2626;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }

  .app {
    width: 100%;
    max-width: 480px;
  }

  h1 {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 24px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }

  .form-row {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
  }

  input {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
  }

  input:focus {
    border-color: var(--accent);
  }

  button {
    width: 100%;
    padding: 10px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }

  button:hover {
    background: var(--accent-hover);
  }

  .error {
    color: var(--error);
    font-size: 13px;
    margin-top: 8px;
    min-height: 16px;
  }

  .expenses-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .expenses-header h2 {
    font-size: 15px;
    margin: 0;
  }

  .total {
    font-size: 13px;
    color: var(--muted);
  }

  ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }

  li:last-child {
    border-bottom: none;
  }

  .desc {
    font-size: 14px;
  }

  .amount {
    font-size: 14px;
    font-weight: 600;
  }

  .empty {
    color: var(--muted);
    font-size: 14px;
    text-align: center;
    padding: 16px 0;
  }
</style>
</head>
<body>
  <div class="app">
    <h1>SplitBill</h1>
    <p class="subtitle">Учёт общих расходов группы</p>

    <div class="card">
      <form id="expense-form">
        <div class="form-row">
          <input type="text" id="description" placeholder="Описание (например, Такси)" required />
        </div>
        <div class="form-row">
          <input type="number" id="amount" placeholder="Сумма, ₸" min="0" step="0.01" required />
        </div>
        <button type="submit">Добавить расход</button>
      </form>
      <p class="error" id="error"></p>
    </div>

    <div class="card">
      <div class="expenses-header">
        <h2>Расходы</h2>
        <span class="total" id="total"></span>
      </div>
      <ul id="expense-list"></ul>
      <p class="empty" id="empty-state" style="display:none;">Пока нет расходов</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
