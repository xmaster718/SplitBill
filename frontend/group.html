<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Группа — SplitBill</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <div class="top-bar">
      <div>
        <a class="back-link" href="groups.html">← Вернуться к группам</a>
        <h1 id="group-name">Группа</h1>
      </div>
      <button class="secondary" id="logout-btn" type="button">Выйти</button>
    </div>

    <div class="summary-grid">
      <div class="summary-card">
        <span class="summary-label">Всего расходов</span>
        <span class="summary-value" id="total-sum">0 ₸</span>
      </div>
      <div class="summary-card">
        <span class="summary-label">Участников</span>
        <span class="summary-value" id="members-count">0</span>
      </div>
    </div>

    <div class="card">
      <h2>Добавить расход</h2>
      <form id="expense-form">
        <div class="inline-form">
          <input type="text" id="expense-name" placeholder="Описание расхода" required />
          <input type="number" id="expense-amount" min="0" step="0.01" placeholder="Сумма" required />
          <button type="submit">Добавить</button>
        </div>
      </form>
      <p class="error" id="error"></p>
    </div>

    <div class="card">
      <div class="toolbar">
        <input id="expense-search" type="search" placeholder="Поиск по описанию расхода" aria-label="Поиск по расходам" />
      </div>
      <ul id="expense-list"></ul>
      <p class="empty" id="empty-state" style="display:none;">В этой группе пока нет расходов</p>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/group.js"></script>
</body>
</html>
