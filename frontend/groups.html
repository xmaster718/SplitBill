<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Мои группы — SplitBill</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <div class="top-bar">
      <h1>Мои группы</h1>
      <button class="secondary" id="logout-btn">Выйти</button>
    </div>

    <div class="card">
      <form id="create-group-form">
        <div class="form-row">
          <input type="text" id="group-name" placeholder="Название группы (например, Поездка в Алматы)" required />
        </div>
        <button type="submit">Создать группу</button>
      </form>
      <p class="error" id="error"></p>
    </div>

    <div class="card">
      <ul id="group-list"></ul>
      <p class="empty" id="empty-state" style="display:none;">У вас пока нет групп</p>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/groups.js"></script>
</body>
</html>
