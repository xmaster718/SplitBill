<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ece2cd">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
<title>Вход — SplitBill</title>
<meta name="robots" content="noindex">
</head>
<body>
<main class="container narrow">
  <p class="center"><a class="brand" href="index.html"><span class="brand-mark"></span>SplitBill</a></p>
  <h1 class="center">Вход</h1>
  <p class="muted center">Рады видеть вас снова</p>
  <form class="card" id="login-form" novalidate>
    <div class="field">
      <label class="label" for="email">Email</label>
      <input class="input" id="email" name="email" type="email" autocomplete="email" required>
    </div>
    <div class="field">
      <label class="label" for="password">Пароль</label>
      <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn btn-block" type="submit">Войти</button>
    <p class="form-error" id="form-error" role="alert"></p>
    <p class="center small muted">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
  </form>
</main>
<script src="js/common.js"></script>
<script src="js/login.js"></script>
</body>
</html>
